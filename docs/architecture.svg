<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" width="1500" height="1120" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <style>
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12.5px;fill:#334155}
      .m{font-size:11.5px;fill:#64748b}
      .req{stroke:#334155;stroke-width:1.8;fill:none}
      .fb{stroke:#0f766e;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    </style>
  </defs>
  <rect width="1500" height="1120" fill="#f8fafc"/>

  <text x="730" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Intelligent AI Inference Gateway — v1 architecture</text>
  <text x="730" y="60" text-anchor="middle" class="m">Two engines (Model Router + Workload Scheduler) · one shared benchmark harness · same gateway code runs against the simulator, real vLLM, or hosted APIs</text>

  <!-- Clients -->
  <g>
    <rect x="330" y="80" width="188" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="424" y="104" text-anchor="middle" class="t">Chatbot</text><text x="424" y="124" text-anchor="middle" class="m">interactive</text>
    <rect x="534" y="80" width="188" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="628" y="104" text-anchor="middle" class="t">Voice agent</text><text x="628" y="124" text-anchor="middle" class="m">interactive · tight TTFT</text>
    <rect x="738" y="80" width="188" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="832" y="104" text-anchor="middle" class="t">Coding agent</text><text x="832" y="124" text-anchor="middle" class="m">class set per call</text>
    <rect x="942" y="80" width="188" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1036" y="104" text-anchor="middle" class="t">Batch jobs</text><text x="1036" y="124" text-anchor="middle" class="m">background</text>
  </g>
  <line x1="730" y1="138" x2="730" y2="160" class="req" marker-end="url(#a)"/>

  <!-- API gateway -->
  <rect x="330" y="162" width="800" height="54" rx="10" class="box"/>
  <text x="730" y="185" text-anchor="middle" class="t">1. API Gateway (FastAPI, OpenAI-compatible)</text>
  <text x="730" y="205" text-anchor="middle" class="s">API key → tenant + allowed classes · request validation · SSE streaming</text>
  <line x1="730" y1="216" x2="730" y2="238" class="req" marker-end="url(#a)"/>

  <!-- Analyzer -->
  <rect x="330" y="240" width="800" height="54" rx="10" class="box"/>
  <text x="730" y="263" text-anchor="middle" class="t">2. Request Analyzer</text>
  <text x="730" y="283" text-anchor="middle" class="s">service class · task type · input tokens · estimated output tokens · deadline / SLO</text>
  <line x1="515" y1="294" x2="515" y2="318" class="req" marker-end="url(#a)"/>
  <line x1="945" y1="294" x2="945" y2="318" class="req" marker-end="url(#a)"/>

  <!-- Router -->
  <rect x="330" y="320" width="370" height="226" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="515" y="346" text-anchor="middle" class="t">A. Model Router — which model?</text>
  <text x="348" y="374" class="s" font-weight="700">Filter (hard constraints)</text>
  <text x="348" y="393" class="s">capability · context fits · quality floor</text>
  <text x="348" y="411" class="s">budget · privacy · queue wait vs deadline</text>
  <text x="348" y="439" class="s" font-weight="700">Rank the eligible models</text>
  <text x="348" y="458" class="s">J(m) = α·cost + β·latency + γ·quality-risk + δ·reliability</text>
  <text x="348" y="476" class="s">latency counts re-prefill if switching models</text>
  <text x="348" y="504" class="s" font-weight="700">Output</text>
  <text x="348" y="523" class="s">model + replica + reason · overflow to hosted API</text>

  <!-- Scheduler -->
  <rect x="760" y="320" width="370" height="226" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="945" y="346" text-anchor="middle" class="t">B. Workload Scheduler — when?</text>
  <text x="778" y="374" class="s" font-weight="700">Queues per service class</text>
  <text x="778" y="393" class="s">interactive · standard · background (bounded)</text>
  <text x="778" y="421" class="s" font-weight="700">Order within and across queues</text>
  <text x="778" y="440" class="s">deadline-aware · per-tenant fairness (VTC)</text>
  <text x="778" y="458" class="s">(no tenant starves others by sending more)</text>
  <text x="778" y="486" class="s" font-weight="700">Admission control</text>
  <text x="778" y="505" class="s">dispatch only when the replica has token headroom</text>
  <text x="778" y="523" class="s">otherwise defer, re-route, or reject (429)</text>

  <line x1="702" y1="420" x2="758" y2="420" class="req" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="730" y="408" text-anchor="middle" class="m">work</text>
  <text x="730" y="440" text-anchor="middle" class="m">capacity</text>

  <!-- Registry & telemetry -->
  <rect x="30" y="320" width="262" height="112" rx="10" class="box"/>
  <text x="161" y="344" text-anchor="middle" class="t">Model Registry (YAML)</text>
  <text x="46" y="368" class="s">capabilities · eval scores per task</text>
  <text x="46" y="387" class="s">input/output token prices</text>
  <text x="46" y="406" class="s">context limits · features</text>
  <text x="46" y="424" class="m">changes rarely</text>

  <rect x="30" y="452" width="262" height="150" rx="10" class="box"/>
  <text x="161" y="476" text-anchor="middle" class="t">Live Telemetry</text>
  <text x="46" y="500" class="s">polls each replica's /metrics</text>
  <text x="46" y="519" class="s">running · waiting · KV-cache use</text>
  <text x="46" y="538" class="s">TTFT / TPOT moving averages</text>
  <text x="46" y="557" class="s">health · error rate · rate limits</text>
  <text x="46" y="582" class="m">changes every second</text>

  <path d="M292,376 L328,376" class="fb" marker-end="url(#g)"/>
  <path d="M292,500 L312,500 L312,560 L758,560 L758,546" class="fb" marker-end="url(#g)"/>
  <path d="M312,500 L312,470 L328,470" class="fb" marker-end="url(#g)"/>

  <!-- Dispatcher -->
  <line x1="515" y1="546" x2="515" y2="586" class="req" marker-end="url(#a)"/>
  <line x1="945" y1="546" x2="945" y2="586" class="req" marker-end="url(#a)"/>
  <rect x="330" y="588" width="800" height="54" rx="10" class="box"/>
  <text x="730" y="611" text-anchor="middle" class="t">3. Execution Dispatcher</text>
  <text x="730" y="631" text-anchor="middle" class="s">one OpenAI-compatible client per backend · stream tokens · timeouts · cancel on client disconnect · circuit breaker</text>
  <line x1="455" y1="642" x2="455" y2="680" class="req" marker-end="url(#a)"/>
  <line x1="735" y1="642" x2="735" y2="680" class="req" marker-end="url(#a)"/>
  <line x1="1015" y1="642" x2="1015" y2="680" class="req" marker-end="url(#a)"/>

  <!-- Backends -->
  <rect x="330" y="682" width="250" height="166" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="455" y="706" text-anchor="middle" class="t">llm-d-inference-sim</text>
  <text x="455" y="724" text-anchor="middle" class="m">reused · local dev, tests, CI · free</text>
  <text x="346" y="750" class="s">vLLM API + metric names</text>
  <text x="346" y="769" class="s">FIFO workers only: no batching,</text>
  <text x="346" y="788" class="s">KV limit, preemption or priority</text>
  <text x="346" y="807" class="s">→ every scheduling claim comes</text>
  <text x="346" y="826" class="s">from the real GPU runs</text>

  <rect x="592" y="664" width="286" height="196" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text x="602" y="678" class="m" fill="#b45309">AWS · Terraform</text>
  <text x="745" y="678" class="m" fill="#b45309">destroyed after run</text>
  <rect x="602" y="682" width="266" height="166" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="735" y="706" text-anchor="middle" class="t">vLLM on a rented GPU</text>
  <text x="735" y="724" text-anchor="middle" class="m">g6.4xlarge · 1× L4 24 GB · on-demand</text>
  <text x="618" y="750" class="s">vLLM 0.32.0, pinned</text>
  <text x="618" y="769" class="s">Qwen3-1.7B + Qwen3-8B-AWQ</text>
  <text x="618" y="788" class="s">two servers, GPU memory split</text>
  <text x="618" y="807" class="s">priority arm: --scheduling-policy</text>
  <text x="618" y="826" class="s">access via SSM, no SSH</text>

  <rect x="890" y="682" width="240" height="166" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="1010" y="706" text-anchor="middle" class="t">Hosted model APIs</text>
  <text x="1010" y="724" text-anchor="middle" class="m">free tiers · OpenAI-compatible</text>
  <text x="906" y="750" class="s">Groq gpt-oss-20b: fast, cheap</text>
  <text x="906" y="769" class="s">Gemini Flash: stronger, slower</text>
  <text x="906" y="788" class="s">overflow target when the GPU</text>
  <text x="906" y="807" class="s">queue would miss a deadline</text>
  <text x="906" y="826" class="s">(no control of their GPUs)</text>

  <!-- /metrics feedback from backends -->
  <path d="M330,770 L240,770 L240,604" class="fb" marker-end="url(#g)"/>
  <text x="250" y="790" class="m" fill="#0f766e">/metrics</text>

  <!-- Observability -->
  <line x1="730" y1="860" x2="730" y2="890" class="fb" marker-end="url(#g)"/>
  <rect x="330" y="892" width="800" height="104" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="730" y="916" text-anchor="middle" class="t">4. Observability &amp; Feedback</text>
  <rect x="346" y="928" width="182" height="54" rx="8" class="box"/>
  <text x="437" y="950" text-anchor="middle" class="s" font-weight="700">Metrics</text>
  <text x="437" y="969" text-anchor="middle" class="m">TTFT · TPOT · p95/p99</text>
  <rect x="540" y="928" width="182" height="54" rx="8" class="box"/>
  <text x="631" y="950" text-anchor="middle" class="s" font-weight="700">Decision log</text>
  <text x="631" y="969" text-anchor="middle" class="m">every route + its reason</text>
  <rect x="734" y="928" width="182" height="54" rx="8" class="box"/>
  <text x="825" y="950" text-anchor="middle" class="s" font-weight="700">Cost accounting</text>
  <text x="825" y="969" text-anchor="middle" class="m">per request · per tenant</text>
  <rect x="928" y="928" width="186" height="54" rx="8" class="box"/>
  <text x="1021" y="950" text-anchor="middle" class="s" font-weight="700">Quality eval</text>
  <text x="1021" y="969" text-anchor="middle" class="m">task success vs eval set</text>
  <path d="M330,944 L200,944 L200,604" class="fb" marker-end="url(#g)"/>
  <path d="M200,944 L18,944 L18,376 L28,376" class="fb" marker-end="url(#g)"/>
  <text x="40" y="964" class="m" fill="#0f766e">calibrates estimates and registry scores</text>

  <!-- Benchmark harness -->
  <rect x="1160" y="80" width="310" height="916" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="1315" y="108" text-anchor="middle" class="t">5. Benchmark harness</text>
  <text x="1315" y="128" text-anchor="middle" class="m">the proof · one command per run</text>
  <text x="1178" y="162" class="s" font-weight="700">Load generator</text>
  <text x="1178" y="181" class="s">mixed traffic: short chat turns +</text>
  <text x="1178" y="200" class="s">30K-token coding contexts + batch</text>
  <text x="1178" y="219" class="s">bursts · GuideLLM, 1 process/class</text>
  <path d="M1160,190 L1140,190 L1140,189 L1132,189" class="req" marker-end="url(#a)"/>

  <text x="1178" y="258" class="s" font-weight="700">Scheduling arms (same workload)</text>
  <text x="1178" y="280" class="s">1. FIFO baseline</text>
  <text x="1178" y="300" class="s">2. Gateway queues + admission</text>
  <text x="1178" y="320" class="s">3. vLLM-native priority only</text>
  <text x="1178" y="340" class="s">4. Gateway + vLLM priority</text>
  <text x="1178" y="360" class="s">5. Separate replica pools</text>
  <text x="1178" y="380" class="s">6. vLLM native admission (503)</text>

  <text x="1178" y="408" class="s" font-weight="700">Routing arms</text>
  <text x="1178" y="428" class="s">always strongest model</text>
  <text x="1178" y="446" class="s">cheapest eligible model</text>
  <text x="1178" y="464" class="s">static task rules</text>
  <text x="1178" y="482" class="s">adaptive (live load + cost)</text>

  <text x="1178" y="518" class="s" font-weight="700">What each run reports</text>
  <text x="1178" y="540" class="s">interactive p95 / p99 TTFT</text>
  <text x="1178" y="560" class="s">background throughput (tokens/s)</text>
  <text x="1178" y="580" class="s">per-tenant fairness</text>
  <text x="1178" y="600" class="s">cost per successful task</text>
  <text x="1178" y="620" class="s">quality vs eval set</text>
  <text x="1178" y="640" class="s">reject / timeout / fallback rate</text>

  <text x="1178" y="678" class="s" font-weight="700">Failure drills</text>
  <text x="1178" y="700" class="s">slow replica · dead replica</text>
  <text x="1178" y="720" class="s">provider rate limit · client cancel</text>

  <text x="1178" y="758" class="s" font-weight="700">Output</text>
  <text x="1178" y="780" class="s">results table + charts in the repo,</text>
  <text x="1178" y="800" class="s">with hardware, model and workload</text>
  <text x="1178" y="820" class="s">recorded so anyone can rerun it</text>

  <text x="1178" y="858" class="s" font-weight="700">GPU experiments (~6 h, ~$8)</text>
  <text x="1178" y="880" class="s">M0 calibration · M1 prefix cache</text>
  <text x="1178" y="900" class="s">M2 scheduling arms · M3 chunked</text>
  <text x="1178" y="920" class="s">prefill · M4 FP8 · M5 spec decode</text>
  <text x="1178" y="940" class="s">M6 router eval set (record once)</text>

  <!-- Footer -->
  <rect x="30" y="1020" width="1100" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="46" y="1044" class="s" font-weight="700">Later extensions (not in v1)</text>
  <text x="46" y="1066" class="s">own continuous-batching simulator · prefill / decode disaggregation · cross-model KV reuse (HeteroFold, RaReCache) · learned router · full AWS deploy (ECS, ALB)</text>
  <text x="46" y="1084" class="m">Start with shared serving capacity; isolate workload pools only when the benchmark shows interference.</text>

  <line x1="1160" y1="1040" x2="1200" y2="1040" class="req" marker-end="url(#a)"/>
  <text x="1210" y="1044" class="s">request path</text>
  <line x1="1160" y1="1068" x2="1200" y2="1068" class="fb" marker-end="url(#g)"/>
  <text x="1210" y="1072" class="s">telemetry and feedback</text>
</svg>
